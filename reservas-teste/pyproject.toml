[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservas-teste"
version = "0.1.0"
description = "Serviço de reservas de salas, repositório de estudo"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["reservas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
